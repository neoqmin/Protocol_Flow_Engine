name: ci
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSSL (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Install OpenSSL (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install openssl@3 || brew list openssl@3
      # -Werror on GCC/Clang only; MSVC runs /W4 without /WX until verified.
      # OpenSSL is REQUIRED on Linux/macOS so a missing library fails loudly instead of
      # silently skipping crypto tests. Windows builds without it until PM-1 (platform work).
      - name: Configure
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            ubuntu-latest) EXTRA="-DPF_WARNINGS_AS_ERRORS=ON -DPF_WITH_OPENSSL=ON" ;;
            macos-latest)  EXTRA="-DPF_WARNINGS_AS_ERRORS=ON -DPF_WITH_OPENSSL=ON -DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" ;;
            *)             EXTRA="-DPF_WITH_OPENSSL=OFF" ;;
          esac
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release $EXTRA
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DPF_WARNINGS_AS_ERRORS=ON -DPF_WITH_OPENSSL=ON -DPF_SANITIZE=address,undefined
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  fuzz-smoke:
    # Verified passing on GitHub-hosted runners (run 37270505817); blocking.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-rt-dev libssl-dev
      - run: cmake -S . -B build -DCMAKE_CXX_COMPILER=clang++ -DPF_BUILD_FUZZ=ON -DPF_WITH_OPENSSL=ON
      - run: cmake --build build
      - run: |
          mkdir -p corpus
          for f in build/tests/fuzz_*; do [ -x "$f" ] && "$f" -max_total_time=20 corpus; done

  interop:
    # Our client against an UNMODIFIED OpenVPN 2.6 server (network namespace, needs sudo).
    # Non-blocking until it has run on GitHub-hosted runners.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev openvpn tcpdump iproute2 iputils-ping nftables openssl
      - run: openvpn --version | head -1
      - run: cmake -S . -B build -DPF_WITH_OPENSSL=ON -DPF_PROTOCOL_TESTS=ON
      - run: cmake --build build
      - run: sudo env "PATH=$PATH" ctest --test-dir build -L protocol --output-on-failure
